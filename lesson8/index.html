<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="fieldset">
        <legend class="title">Ваши личные данные</legend>
        <label class="label" for="name">Ваше имя</label>
        <input
          id="name"
          class="input"
          type="text"
          name="name"
          placeholder="Имя"
          required
        />
        <label class="label" for="age">Ваш возраст</label>
        <input
          id="age"
          type="number"
          class="input"
          name="age"
          placeholder="Возраст"
          required
        />
        <label class="label" for="number">Ваш номер телефона</label>
        <input
          id="number"
          type="tel"
          class="input"
          name="number"
          placeholder="Номер телефона"
          required
        />
        <label class="label" for="email">Ваша почта</label>
        <input
          id="email"
          type="email"
          class="input"
          name="email"
          placeholder="Почта"
          required
        />
      </fieldset>
      <fieldset class="fieldset1">
        <label class="label" for="message">Сообщение</label>
        <textarea
          name="message"
          id="message"
          class="textarea textarea-1"
          placeholder="Ваше сообщение"
        ></textarea>
        <label class="label checkbox-label"></label>
        <input class="checkbox" type="checkbox" name="checkbox" required />
        <span class="checkbox-text">Я принимаю правила</span>
      </fieldset>
      <button class="button">Отправить</button>
    </form>
  </body>
</html>
