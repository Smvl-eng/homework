<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <fieldset class="fieldset1">
        <h2 class="titleh2">Ваши личные данные</h2>
        <label>
          <h3 class="titleh3">Ваше имя</h3>
          <input
            type="text"
            class="input1"
            placeholder="Имя"
            name="name"
            required
          />
        </label>
        <label>
          <h3 class="titleh3">Ваш возраст</h3>
          <input
            type="number"
            class="input1"
            placeholder="Возраст"
            name="age"
            required
          />
        </label>
        <label>
          <h3 class="titleh3">Ваш номер телефона</h3>
          <input
            type="tel"
            class="input1"
            placeholder="Номер телефона"
            name="phone number"
            required
          />
          <label>
            <h3 class="titleh3">Ваша почта</h3>
          <input
            type="email"
            class="input1"
            placeholder="Почта"
            name="phone number"
            required
            />
        </label>
        <label>
        <h3 class="titleh3">Сообщение</h3>
        <textarea class="message" name="message" id="text" placeholder="Ваше сообщение"></textarea>
        </label>
        <label class="bottomtext">
            <input type="checkbox" class="checkbox" name="checkbox" required>
           Я принимаю правила
        </label>
        <button class="button">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
